<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" class="booting">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑师专属工作台</title>
<link rel="stylesheet" href="vendor/remixicon/remixicon.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" aria-hidden="true"><div class="boot-mark"><i class="ri-building-4-fill"></i></div><div class="boot-t">建筑师专属工作台</div><div class="boot-bar"><i></i></div></div>
<div id="app">
  <header id="menubar">
    <div class="logo"><span class="mark"><i class="ri-building-4-fill"></i></span>建筑师专属工作台</div>
    <nav class="menus" id="menus"></nav>
    <div class="spacer"></div>
    <button class="cmdk" id="cmdkBtn" title="命令面板 (Ctrl+K)"><i class="ri-search-line"></i><span>搜索智能体、项目、命令…</span><kbd>Ctrl K</kbd></button>
    <div class="spacer"></div>
    <div class="mb-right"><i class="ri-folder-open-line"></i><select id="projectSelect" title="切换项目" aria-label="切换项目"></select></div>
    <div class="winctl hidden" id="winctl"><button id="wMin" title="最小化"><i class="ri-subtract-line"></i></button><button id="wMax" title="最大化"><i class="ri-checkbox-blank-line"></i></button><button id="wClose" class="close" title="关闭"><i class="ri-close-line"></i></button></div>
  </header>
  <div id="toolbar"></div>
  <div id="ctxbar" role="status" aria-live="polite">
    <span class="ctx-proj"><i class="ri-building-4-line"></i><b id="ctxName">—</b><span class="muted" id="ctxCode"></span></span>
    <span class="ctx-stage"><i class="ri-route-line"></i><span id="ctxStage">—</span></span>
    <span class="ctx-hint muted" id="ctxHint">选择智能体或按 Ctrl+P 启动 AI 自动推进</span>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="ctxPipe" title="AI 自动推进 (Ctrl+P)"><i class="ri-robot-2-line"></i>推进</button>
    <button class="btn ghost sm" id="ctxRun" title="运行当前 (F5)"><i class="ri-play-fill"></i>运行</button>
  </div>
  <div id="main">
    <aside id="sidebar">
      <div class="pane-head"><span>项目资源管理器</span><span class="spacer"></span><button class="tb-ico" id="collapseAll" title="全部折叠"><i class="ri-subtract-line"></i></button></div>
      <div class="side-search"><i class="ri-search-line"></i><input id="navSearch" placeholder="搜索智能体（如：规范、图审）" aria-label="搜索智能体"></div>
      <div id="tree"></div>
    </aside>
    <div class="splitter v" data-split="side"></div>
    <section id="center">
      <div id="tabbar"></div>
      <div id="tabcontent"></div>
      <div class="splitter h" data-split="bottom"></div>
      <div id="bottom">
        <div class="pane-head"><div class="btabs" id="btabs"><span data-b="log" class="on">输出</span><span data-b="problems">问题 <b id="probCount">0</b></span></div><span class="spacer"></span><button class="tb-ico" id="clearLog" title="清空输出"><i class="ri-delete-bin-6-line"></i></button><button class="tb-ico" id="hideBottom" title="隐藏面板"><i class="ri-close-line"></i></button></div>
        <div id="bottomBody"></div>
      </div>
    </section>
    <div class="splitter v" data-split="props"></div>
    <aside id="props"></aside>
  </div>
  <footer id="statusbar">
    <span id="sbMode"></span><span id="sbProject"></span><span id="sbStage"></span><span id="sbMsg">就绪</span><span id="sbSave" class="saved" aria-live="polite"><i class="ri-cloud-line"></i>本机存储</span>
    <span class="spacer"></span><span id="sbOpen"></span><span id="sbUsage"></span><span id="sbRuns"></span><span id="sbTheme"></span><span id="sbClock"></span>
  </footer>
</div>
<div id="ctxmenu" class="dropdown"></div>
<div id="modal" class="hidden"><div class="modal-box"><div class="modal-head"><b id="modalTitle"></b><button class="tb-ico" id="modalClose" title="关闭"><i class="ri-close-line"></i></button></div><div id="modalBody"></div></div></div>
<div id="palette" class="hidden"><div class="pal" role="dialog" aria-label="命令面板"><div class="pal-in"><i class="ri-search-line"></i><input id="palInput" placeholder="输入智能体、项目或命令，如：规范、图纸、新建、主题" autocomplete="off"><kbd>Esc</kbd></div><div id="palList" role="listbox"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 执行</span><span><kbd>Esc</kbd> 关闭</span></div></div></div>
<aside id="chatPanel" class="hidden" aria-label="AI 项目助手"><div class="ch-h"><i class="ri-chat-smile-3-line"></i><b>AI 项目助手</b><span class="spacer"></span><button class="tb-ico" id="chatClear" title="清空对话"><i class="ri-delete-bin-6-line"></i></button><button class="tb-ico" id="chatClose" title="关闭"><i class="ri-close-line"></i></button></div><div id="chatList"></div><div class="ch-in"><textarea id="chatInput" placeholder="提问，或输入 / 命令、@智能体（Enter 发送）" aria-label="向 AI 助手提问"></textarea><button class="btn" id="chatSend" title="发送"><i class="ri-send-plane-2-fill"></i></button></div></aside>
<div id="toasts" aria-live="polite" aria-relevant="additions"></div>
<input type="file" id="fileInput" accept=".json" hidden>
<input type="file" id="kbFile" accept=".docx,.txt,.md,.pdf" hidden>
<input type="file" id="briefFile" accept=".docx,.txt,.md,.pdf" hidden>
<script src="agents.js"></script>
<script src="docx.js"></script>
<script src="pro.js"></script>
<script src="ai.js"></script>
<script src="pilot.js"></script>
<script src="app.js"></script>
</body>
</html>
